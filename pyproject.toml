[project]
name = "kz-labs"
version = "0.1.0"
description = "Computer vision labs monorepo (LW1 variant 7 first)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.hatch.build.targets.wheel]
packages = ["src/lab1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
